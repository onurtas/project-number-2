name: "Hourly — Anomaly Alerts (Type C)"

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
    inputs:
      verify_baseline:
        description: "Print cached vs freshly computed baseline comparison"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  anomaly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore dedup log
        run: |
          mkdir -p gdelt_bq_results
          if [ -f data/anomaly_dedup_log.json ]; then
            cp data/anomaly_dedup_log.json gdelt_bq_results/anomaly_dedup_log.json
            echo "Restored dedup log"
          else
            echo "No existing dedup log"
          fi
          if [ -f data/anomaly_baseline_cache.json ]; then
            cp data/anomaly_baseline_cache.json gdelt_bq_results/anomaly_baseline_cache.json
            echo "Restored baseline cache"
          else
            echo "No existing baseline cache"
          fi

      - name: Run anomaly detection
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          BASELINE_VERIFY: ${{ github.event.inputs.verify_baseline || 'false' }}
        run: python scripts/anomaly_alerts_c.py

      - name: Save baseline cache (before posting — cache validity is independent of post success)
        run: |
          mkdir -p data
          if [ -f gdelt_bq_results/anomaly_baseline_cache.json ]; then
            if ! cmp -s gdelt_bq_results/anomaly_baseline_cache.json data/anomaly_baseline_cache.json; then
              cp gdelt_bq_results/anomaly_baseline_cache.json data/anomaly_baseline_cache.json
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add data/anomaly_baseline_cache.json
              git diff --cached --quiet || git commit -m "Update anomaly baseline cache [skip ci]"
              git pull --rebase origin main
              git push
              echo "Baseline cache committed"
            else
              echo "Baseline cache unchanged"
            fi
          fi

      - name: Post to X (only if anomalies found)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          POST_JSON=$(ls gdelt_bq_results/*_post.json 2>/dev/null | head -1)
          if [ -n "$POST_JSON" ]; then
            python scripts/twitter_poster.py "$POST_JSON" anomaly
          else
            echo "No anomalies detected, skipping tweet"
          fi

      - name: Save dedup log back to repo
        run: |
          mkdir -p data
          if [ -f gdelt_bq_results/anomaly_dedup_log.json ]; then
            cp gdelt_bq_results/anomaly_dedup_log.json data/anomaly_dedup_log.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/anomaly_dedup_log.json
            git diff --cached --quiet || git commit -m "Update anomaly dedup log [skip ci]"
            git push
          fi

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anomaly-outputs-${{ github.run_id }}
          path: gdelt_bq_results/
          retention-days: 30
