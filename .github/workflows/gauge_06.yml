name: "06:00 — Sentiment Gauge (Type A)"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  gauge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gauge script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
        run: python scripts/gauge_type_a.py

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          POST_JSON=$(ls gdelt_bq_results/*_post.json 2>/dev/null | head -1)
          if [ -n "$POST_JSON" ]; then
            python scripts/twitter_poster.py "$POST_JSON" gauge
          else
            echo "No post JSON found, skipping tweet"
          fi

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gauge-outputs-${{ github.run_id }}
          path: gdelt_bq_results/
          retention-days: 30
