name: "12:00 — Coin Rankings AR (B1/B3 only; B2 unified into TR workflow)"

# Moved from 15:00 to 12:00 (2026-07-12) so AR and TR rankings post at the
# same time. On B2 days this workflow does nothing: the unified
# ranking_b2_sentiment.py in the TR 12:00 workflow computes once and posts
# identical-data TR + AR posts. B1/B3 AR still run here (own compute).

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  rankings_ar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install arabic-reshaper python-bidi

      - name: Determine which ranking to run (B1→B2→B3 rotation)
        id: pick
        run: |
          DAY=$(date +%j)
          MOD=$(( DAY % 3 ))
          if [ $MOD -eq 0 ]; then
            echo "script=scripts/ranking_b1_volume_ar.py" >> $GITHUB_OUTPUT
            echo "name=B1-Volume-AR" >> $GITHUB_OUTPUT
          elif [ $MOD -eq 1 ]; then
            echo "script=SKIP" >> $GITHUB_OUTPUT
            echo "name=B2-unified-skip" >> $GITHUB_OUTPUT
          else
            echo "script=scripts/ranking_b3_movers_ar.py" >> $GITHUB_OUTPUT
            echo "name=B3-Movers-AR" >> $GITHUB_OUTPUT
          fi

      - name: Run ranking (${{ steps.pick.outputs.name }})
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
        run: |
          if [ "${{ steps.pick.outputs.script }}" = "SKIP" ]; then
            echo "B2 day: AR post is produced by the unified TR 12:00 workflow. Nothing to run."
          else
            python ${{ steps.pick.outputs.script }}
          fi

      - name: Post to X (Arabic)
        env:
          X_API_KEY: ${{ secrets.X_AR_API_KEY }}
          X_API_SECRET: ${{ secrets.X_AR_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_AR_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_AR_ACCESS_SECRET }}
        run: |
          POST_JSON=$(ls gdelt_bq_results/*_post.json 2>/dev/null | head -1)
          if [ -n "$POST_JSON" ]; then
            python scripts/twitter_poster.py "$POST_JSON" ranking
          else
            echo "No post JSON found, skipping tweet"
          fi

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-ar-${{ steps.pick.outputs.name }}-${{ github.run_id }}
          path: gdelt_bq_results/
          retention-days: 30
