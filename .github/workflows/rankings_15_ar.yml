name: "15:00 — Coin Rankings AR (Type B, own compute, AR post only)"

# Restores the pre-2026-07-12 AR prime-time slot (18:00 Riyadh / 19:00 Dubai).
# Runs the SAME unified fixed scripts as the 12:00 TR workflow — never the
# inert _ar scripts (they carry the old head/tail defect). This run computes
# its own 6h window (09:00–15:00 UTC), so AR posts differ from TR by timing,
# per the 2026-07-14 design reversal. Only the *_ar_* post JSON is posted.

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # arabic-reshaper + python-bidi installed explicitly: the unified
        # scripts render the Arabic chart and MUST have working shaping.
        run: |
          pip install -r requirements.txt
          pip install arabic-reshaper python-bidi

      - name: Determine which ranking to run (B1→B2→B3 rotation)
        id: pick
        run: |
          DAY=$(date +%j)
          MOD=$(( DAY % 3 ))
          if [ $MOD -eq 0 ]; then
            echo "script=scripts/ranking_b1_volume.py" >> $GITHUB_OUTPUT
            echo "name=B1-Volume" >> $GITHUB_OUTPUT
          elif [ $MOD -eq 1 ]; then
            echo "script=scripts/ranking_b2_sentiment.py" >> $GITHUB_OUTPUT
            echo "name=B2-Sentiment" >> $GITHUB_OUTPUT
          else
            echo "script=scripts/ranking_b3_movers.py" >> $GITHUB_OUTPUT
            echo "name=B3-Movers" >> $GITHUB_OUTPUT
          fi

      - name: Run ranking (${{ steps.pick.outputs.name }})
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
        run: python ${{ steps.pick.outputs.script }}

      - name: Post to X (Arabic)
        env:
          X_API_KEY: ${{ secrets.X_AR_API_KEY }}
          X_API_SECRET: ${{ secrets.X_AR_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_AR_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_AR_ACCESS_SECRET }}
        run: |
          POST_JSON=$(ls gdelt_bq_results/*_ar_*_post.json 2>/dev/null | head -1)
          if [ -n "$POST_JSON" ]; then
            python scripts/twitter_poster.py "$POST_JSON" ranking
          else
            echo "No AR post JSON found (quiet-window gate), skipping tweet"
          fi

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-ar-${{ steps.pick.outputs.name }}-${{ github.run_id }}
          path: gdelt_bq_results/
          retention-days: 30
