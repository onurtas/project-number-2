name: "18:00 — Country Comparisons (Type E)"

on:
  schedule:
    - cron: '0 18 * * *'  # 18:00 UTC daily
  workflow_dispatch:        # manual trigger for testing

jobs:
  countries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run country comparison script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
        run: python scripts/country_comparison_e.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countries-outputs-${{ github.run_id }}
          path: gdelt_bq_results/
          retention-days: 30
