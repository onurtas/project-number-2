name: "12:00 — Coin Rankings (Type B, B2 unified TR+AR)"

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # arabic-reshaper + python-bidi installed explicitly: the unified B2
        # script renders the Arabic chart and MUST have working shaping.
        run: |
          pip install -r requirements.txt
          pip install arabic-reshaper python-bidi

      - name: Determine which ranking to run (B1→B2→B3 rotation)
        id: pick
        run: |
          DAY=$(date +%j)
          MOD=$(( DAY % 3 ))
          if [ $MOD -eq 0 ]; then
            echo "script=scripts/ranking_b1_volume.py" >> $GITHUB_OUTPUT
            echo "name=B1-Volume" >> $GITHUB_OUTPUT
          elif [ $MOD -eq 1 ]; then
            echo "script=scripts/ranking_b2_sentiment.py" >> $GITHUB_OUTPUT
            echo "name=B2-Sentiment" >> $GITHUB_OUTPUT
          else
            echo "script=scripts/ranking_b3_movers.py" >> $GITHUB_OUTPUT
            echo "name=B3-Movers" >> $GITHUB_OUTPUT
          fi

      - name: Run ranking (${{ steps.pick.outputs.name }})
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
        run: python ${{ steps.pick.outputs.script }}

      - name: Post to X (Turkish)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          POST_JSON=$(ls gdelt_bq_results/*_post.json 2>/dev/null | grep -v '_ar_' | head -1)
          if [ -n "$POST_JSON" ]; then
            python scripts/twitter_poster.py "$POST_JSON" ranking
          else
            echo "No TR post JSON found, skipping tweet"
          fi

      - name: Post to X (Arabic — B2 unified days only)
        env:
          X_API_KEY: ${{ secrets.X_AR_API_KEY }}
          X_API_SECRET: ${{ secrets.X_AR_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_AR_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_AR_ACCESS_SECRET }}
        run: |
          POST_JSON=$(ls gdelt_bq_results/*_ar_*_post.json 2>/dev/null | head -1)
          if [ -n "$POST_JSON" ]; then
            python scripts/twitter_poster.py "$POST_JSON" ranking
          else
            echo "No AR post JSON found (B1/B3 day or gated), skipping tweet"
          fi

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-${{ steps.pick.outputs.name }}-${{ github.run_id }}
          path: gdelt_bq_results/
          retention-days: 30
